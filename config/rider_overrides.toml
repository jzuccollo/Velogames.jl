# Rider name overrides, reviewed by hand.
#
# Read by Velogames.jl (`src/utilities.jl`, `load_rider_overrides`) and by
# vgleague (`src/vgleague/matching.py`, through $VELOGAMES_JL). This copy is
# the only one. Resolution order for a printed name against a race's field:
#
#   1. the printed name's key is a field rider's key   -> exact
#   2. a [[match]] entry for the printed name          -> override, or
#                                                         override_absent when
#                                                         the rider is not in
#                                                         that field
#   3. the rule steps (depunct ... surname_typo)
#   4. a [[refuse]] entry for the printed name         -> override_refused
#
# A [[match]] is still subject to the frame rule: it may not take a rider whom
# another row of the same frame matches exactly (collides_exact).
#
# A [[refuse]] with `rider` refuses only that rider: the rules' answer stands
# if it is someone else. Without `rider` it refuses every rule match. Either
# way a refused name the rules did not match at all is reported as
# override_refused, so the unresolved-names report shows it was reviewed.
#
# Fields (all strings unless stated):
#   printed   the name as a source printed it. Matched by createkey, so case,
#             accents and word order do not matter.
#   rider     match: the rider's name as Velogames prints it in the field
#             (matched by createkey against the field's keys).
#             refuse: optional, the rider the printed name must not match.
#   source    optional scope: an archive type (odds, odds_kom, odds_points,
#             odds_stagewin, oracle, oracle_kom, oracle_points, pcs_results,
#             pcs_stage_results, pcs_gc_results, pcs_abandons, pcs_specialty,
#             predictions, vg_results, ...).
#   race      optional scope: a PCS race slug.
#   year      optional scope: an integer season.
#   reason    required: short and factual, with the evidence.
#   reviewed  required: the date of the review (a TOML date).
#
# An entry with a scope applies only where the caller states that scope. The
# model's market lookups in Velogames.jl state the source and year but not the
# race, and its race history the source only, so a race-scoped entry reaches
# the publication, the backtest and the cross-language digests but not
# production estimation.
# Where a scoped and a global entry both apply, the one with more scope wins.
#
# Workflow: `vgleague unresolved-names` (or `julia --project
# scripts/unresolved_names.jl`) lists every printed name nothing resolved;
# review the ones that are not non-starters, add a line here, and run
# `python scripts/check_rider_matching.py` in vgleague and the golden corpus
# testset here.

